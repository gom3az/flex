[package]
name = "flex-rice"
description = "Hyprland-rice glue for flex-core: the providers and the `flex` dispatcher"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Machine-specific by design (hyprpaper, cliphist, nmcli, wpctl, ML4W paths):
# this half is never published.
publish = false

[[bin]]
name = "flex"
path = "src/main.rs"

[[bin]]
name = "flex-power"
path = "src/bin/flex-power.rs"

[[bin]]
name = "flex-profile"
path = "src/bin/flex-profile.rs"

[[bin]]
name = "flex-launch"
path = "src/bin/flex-launch.rs"

[[bin]]
name = "flex-shot"
path = "src/bin/flex-shot.rs"

[[bin]]
name = "flex-theme"
path = "src/bin/flex-theme.rs"

[[bin]]
name = "flex-clip"
path = "src/bin/flex-clip.rs"

[[bin]]
name = "flex-center"
path = "src/bin/flex-center.rs"

[[bin]]
name = "flex-wallpaper"
path = "src/bin/flex-wallpaper.rs"

[[bin]]
name = "flex-wifi"
path = "src/bin/flex-wifi.rs"

[[bin]]
name = "flex-proc"
path = "src/bin/flex-proc.rs"

[[bin]]
name = "flex-record"
path = "src/bin/flex-record.rs"

[[bin]]
name = "flex-mixer"
path = "src/bin/flex-mixer.rs"

[[bin]]
name = "flex-net"
path = "src/bin/flex-net.rs"

[[bin]]
name = "flex-bt"
path = "src/bin/flex-bt.rs"

[[bin]]
name = "flex-notify"
path = "src/bin/flex-notify.rs"

[dependencies]
# The engine, built from the sibling `flex-core` member (see the workspace root).
flex-core.workspace = true
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width.workspace = true
signal-hook.workspace = true
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
