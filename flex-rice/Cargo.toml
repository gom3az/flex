[package]
name = "flex-rice"
description = "Hyprland-rice glue for flex-core: the eight providers and the `flex` dispatcher"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Machine-specific by design (hyprpaper, cliphist, nmcli, wpctl, ML4W paths):
# this half is never published.
publish = false

[[bin]]
name = "flex"
path = "src/main.rs"

[[bin]]
name = "flex-power"
path = "src/bin/flex-power.rs"

[[bin]]
name = "flex-launch"
path = "src/bin/flex-launch.rs"

[[bin]]
name = "flex-shot"
path = "src/bin/flex-shot.rs"

[[bin]]
name = "flex-theme"
path = "src/bin/flex-theme.rs"

[[bin]]
name = "flex-clip"
path = "src/bin/flex-clip.rs"

[[bin]]
name = "flex-center"
path = "src/bin/flex-center.rs"

[[bin]]
name = "flex-wallpaper"
path = "src/bin/flex-wallpaper.rs"

[[bin]]
name = "flex-wifi"
path = "src/bin/flex-wifi.rs"

[[bin]]
name = "flex-proc"
path = "src/bin/flex-proc.rs"

[[bin]]
name = "flex-record"
path = "src/bin/flex-record.rs"

[dependencies]
# The engine, built from the sibling `flex-core` member (see the workspace root).
flex-core.workspace = true
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
ratatui.workspace = true

[lints]
workspace = true
