[package]
name = "flex-core"
description = "Reusable Rust TUI menu engine: menu rendering, fuzzy filtering, key handling and kitty-graphics previews"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords = ["tui", "menu", "launcher", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
futures = "0.3.34"
# Pinned: layout must match the wiremix-derived design system exactly.
ratatui.workspace = true
tokio = { version = "1.53.1", features = ["macros", "time", "sync"] }
# Non-CJK widths: narrow ambiguous codepoints (no `cjk` feature). See `src/width.rs`.
unicode-width.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "rerank"
harness = false

[lints]
workspace = true
